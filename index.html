<html lang="ko">
<head>
<meta charset="utf-8">

<title>Speak My Story · 60분 스피킹</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#13262A; --slate:#1F3A3D; --concrete:#D9DCD6; --paper:#F3F5F2; --card:#FFFFFF;
  --signal:#E3B23C; --alert:#B5452F; --mute:#5C6E70; --ok:#2F6B4F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark; --ink:#E8ECEA; --slate:#7FA9AD; --concrete:#34474A; --paper:#162426; --card:#1D2E31; --mute:#9BB0B2; }
}
:root[data-theme="dark"]{color-scheme:dark; --ink:#E8ECEA; --slate:#7FA9AD; --concrete:#34474A; --paper:#162426; --card:#1D2E31; --mute:#9BB0B2; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  line-height:1.6;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
main{max-width:680px;margin:0 auto;padding:20px 18px 110px}
h1{font-size:1.9rem;line-height:1.2;margin:0}
h2{font-size:1.35rem;line-height:1.3;margin:0 0 4px}
h3{font-size:1rem;margin:20px 0 8px}
p{margin:6px 0}
.mute{color:var(--mute)} .small{font-size:.82rem} .xs{font-size:.74rem}
.btn{font:inherit;font-weight:600;font-size:.88rem;border:0;border-radius:6px;padding:11px 16px;cursor:pointer;background:var(--slate);color:var(--paper)}
.btn.sig{background:var(--signal);color:#13262A}
.btn.ghost{background:transparent;color:var(--slate);border:1.5px solid var(--slate)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.link:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;font:inherit;font-size:.8rem;cursor:pointer;padding:4px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
textarea,input[type=text],input[type=password],select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--concrete);border-radius:6px;padding:10px}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:10px 0 12px;border-bottom:1px solid var(--concrete);margin-bottom:18px}
.clock{display:flex;justify-content:space-between;align-items:baseline}
.clock b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.paused-body .q,.paused-body .flash{opacity:.45;pointer-events:none}
.ctrl{display:flex;gap:6px;margin-top:8px}
.ctrl .btn{flex:1;padding:8px 6px;font-size:.8rem}
.phases{display:flex;gap:3px;margin-top:8px}
.phases button{font:inherit;border:0;cursor:pointer;padding:0 2px;height:26px;border-radius:3px;background:var(--concrete);font-size:.68rem;display:flex;align-items:center;justify-content:center;color:var(--mute);overflow:hidden;white-space:nowrap}
.phases button.done{background:var(--slate);color:var(--paper)}
.phases button.now{background:var(--signal);color:#13262A;font-weight:700}
/* blocks */
.q{padding:16px 0;border-top:1px solid var(--concrete)}
.q .text{font-weight:600;font-size:1.05rem;line-height:1.4}
.rec{margin-top:10px}
.rec-bar{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.meter{flex:1}
.meta{display:flex;justify-content:space-between;font-size:.74rem;color:var(--mute);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--concrete);border-radius:3px;margin-top:3px}
.fill{height:6px;background:var(--slate);border-radius:3px}
.recording .fill{background:var(--signal)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.topic{font:inherit;font-size:.85rem;text-align:left;padding:10px;border-radius:6px;border:1px solid var(--concrete);background:var(--card);color:var(--ink);cursor:pointer}
.topic.on{border:2px solid var(--signal)}
.topic small{display:block;color:var(--mute);font-size:.7rem}
.qpick label{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--concrete);cursor:pointer;font-size:.93rem}
.fbtn{border:0;cursor:pointer;font:inherit;font-size:.72rem}
.fbtn.on{background:var(--slate);color:var(--paper)}
.model{margin-top:10px;padding:12px;border-radius:6px;background:var(--card);border-left:3px solid var(--signal)}
.script{font-size:.98rem;line-height:1.75;margin:8px 0}
.spk{padding:7px 12px;font-size:.82rem}
.spk.playing{background:var(--signal);color:#13262A}
.who{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;font-weight:600;margin-bottom:10px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.pcard{font:inherit;text-align:left;padding:22px 16px;border-radius:10px;border:1.5px solid var(--concrete);background:var(--card);color:var(--ink);cursor:pointer;min-height:130px;display:flex;flex-direction:column;gap:6px}
.pcard b{font-size:1.6rem}.pcard span{font-size:.78rem;color:var(--mute)}
.pcard em{font-style:normal;font-size:.7rem;color:#13262A;background:var(--signal);border-radius:10px;padding:1px 8px;align-self:flex-start}
.pcard.last{border-color:var(--signal)}
button,.topic,.pcard{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.modal{position:fixed;inset:0;background:rgba(10,20,22,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
.modal .box{background:var(--card);color:var(--ink);border-radius:10px;padding:20px;max-width:420px;width:100%;font-size:.95rem}
.ok{color:var(--ok)} .bad{color:var(--alert)}
.tabs2{display:flex;margin:22px 0 6px;border-bottom:1px solid var(--concrete)}
.tabs2 button{flex:1;font:inherit;font-weight:600;padding:10px 0;background:none;border:0;color:var(--mute);cursor:pointer}
.tabs2 button.on{color:var(--ink);box-shadow:inset 0 -3px 0 var(--signal)}
.fl{display:block;font-size:.85rem;font-weight:600;margin-top:12px}
.fl input{margin-top:5px;font-weight:400}
.chip{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:10px;background:var(--concrete);color:var(--ink)}
.flash{background:var(--card);border-radius:8px;padding:22px 18px;text-align:center;margin:10px 0}
.flash .ko{font-size:1.1rem;font-weight:600}
.flash .en{font-size:1.15rem;margin-top:10px;color:var(--slate);font-weight:600}
.blk{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--concrete);font-size:.9rem}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px;margin:14px 0 6px}
.kpi b{display:block;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.76rem;color:var(--mute)}
.score-big{font-size:3.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.delta-up{color:var(--ok);font-weight:600} .delta-down{color:var(--alert);font-weight:600}
.bars .r{display:grid;grid-template-columns:92px 1fr 44px;gap:10px;align-items:center;font-size:.84rem;margin:5px 0}
.bars .t{height:10px;background:var(--concrete);border-radius:3px}
.bars .t i{display:block;height:10px;background:var(--slate);border-radius:3px}
.tbl{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:.8rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-bottom:1px solid var(--concrete);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{color:var(--mute);font-weight:500}
svg text{fill:var(--mute);font-size:10px;font-family:inherit}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--slate);padding-bottom:env(safe-area-inset-bottom,0)}
nav div{max-width:680px;margin:0 auto;display:flex}
nav button{flex:1;font:inherit;font-weight:600;font-size:.88rem;padding:15px 0;background:none;border:0;color:#F3F5F2;opacity:.65;cursor:pointer}
nav button.on{opacity:1;box-shadow:inset 0 -3px 0 var(--signal)}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;font-size:.85rem;display:none;max-width:90%;z-index:20}
input[type=range]{width:100%;accent-color:var(--slate)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function fbWrapDb(sdk,fsdb){ // Firestore를 앱의 저장 인터페이스(doc/collection/get/set/delete)에 맞춤
  const wrapDoc=path=>({path,
    get:async()=>{const sn=await sdk.fs.getDoc(sdk.fs.doc(fsdb,path));return {id:sn.id,exists:sn.exists(),data:()=>sn.data()}},
    set:d=>sdk.fs.setDoc(sdk.fs.doc(fsdb,path),d),
    delete:()=>sdk.fs.deleteDoc(sdk.fs.doc(fsdb,path)),
    collection:sub=>wrapCol(path+'/'+sub)});
  const wrapCol=path=>({path,doc:id=>wrapDoc(path+'/'+id),
    get:async()=>{const q=await sdk.fs.getDocs(sdk.fs.collection(fsdb,path));return {docs:q.docs.map(d=>({id:d.id,exists:true,data:()=>d.data()})),size:q.size,empty:q.empty}}});
  return {doc:wrapDoc,collection:wrapCol};
}

const QTYPES={B:'기본',D:'묘사·루틴',E:'과거 경험',C:'변화·비교',O:'의견·이슈',R:'롤플레이'};
const qType=q=>{const m=/^([BDECOR]):/.exec(q||'');return m?m[1]:null};
const qText=q=>(q||'').replace(/^[BDECOR]:/,'').replace(/'/g,'’');

function topicQs(t){const c=S.custom[t.id]||[];return t.id==='mine'?c:c.concat(t.qs)}

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',2600)}
function wpm(a){return a&&a.secs>=10&&words(a.text)?Math.round(words(a.text)/(a.secs/60)):null}
function avg(arr){const v=arr.filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((s,x)=>s+x,0)/v.length:null}
function r1(x){return x==null?'–':Math.round(x)}

function suggestTopic(){
  const used={};S.sessions.forEach(s=>used[s.topicId]=s.date);
  const pool=visibleTopics().filter(t=>topicQs(t).length);
  const fresh=pool.find(t=>!used[t.id]);
  if(fresh)return fresh.id;
  return pool.sort((a,b)=>used[a.id]<used[b.id]?-1:1)[0].id;
}
function ladder(qs){
  const pick=t=>{const c=qs.filter(q=>qType(q)===t);return c.length?c[Math.floor(Math.random()*c.length)]:null};
  const out=['B','D','E',Math.random()<.5?'C':'O','R'].map(pick).filter(Boolean);
  return out.length?out:qs.slice().sort(()=>Math.random()-.5).slice(0,4);
}
function newDraft(){
  const tid=suggestTopic();
  return {date:todayStr(),phase:0,topicId:tid,sel:ladder(topicQs(topicById(tid))),filter:'',
    answers:[],blocked:[],review:{ok:0,fuzzy:0,miss:0,ids:[]},prevDone:[],
    self:{natural:3,confident:3},startedAt:Date.now(),pausedMs:0,pausedAt:null};
}
function elapsedSec(){
  if(!D)return 0;const now=Date.now();

/* ================= metrics ================= */
function computeMetrics(d){
  const a1=d.answers.map(a=>a.a1), a2=d.answers.map(a=>a.a2);
  const w1=avg(a1.map(a=>words(a.text))), w2=avg(a2.map(a=>words(a.text)));
  const p1=avg(a1.map(wpm)), p2=avg(a2.map(wpm));
  const allText=a1.map(a=>a.text).join(' ');
  const fill=words(allText)?(allText.match(FILLERS)||[]).length/words(allText)*100:0;
  let gain=null;
  if(p1&&p2)gain=(p2-p1)/p1; else if(w1&&w2)gain=(w2-w1)/w1;
  const rv=d.review, rt=rv.ok+rv.fuzzy+rv.miss;
  const recall=rt?(rv.ok+rv.fuzzy*0.5)/rt:null;
  const parts=[
    {k:'발화량',w:25,v:w1==null?null:Math.min(w1/100,1),note:`1차 평균 ${r1(w1)}단어 (100단어=만점)`},
    {k:'말하기 속도',w:20,v:p1==null?null:Math.min(p1/120,1),note:`1차 평균 ${r1(p1)} WPM (120=만점)`},
    {k:'2차 개선',w:15,v:gain==null?null:Math.max(0,Math.min(gain,0.4))/0.4,note:gain==null?'2차 답변 없음':`${gain>=0?'+':''}${Math.round(gain*100)}% (+40%=만점)`},
    {k:'복습 회상',w:20,v:recall,note:rt?`${rv.ok}기억 · ${rv.fuzzy}애매 · ${rv.miss}모름`:'복습 카드 없음'},
    {k:'자기평가',w:20,v:(d.self.natural+d.self.confident-2)/8,note:`자연스러움 ${d.self.natural} · 자신감 ${d.self.confident}`}
  ];
  const used=parts.filter(p=>p.v!=null), W=used.reduce((s,p)=>s+p.w,0);
  const score=W?Math.round(used.reduce((s,p)=>s+p.v*p.w,0)/W*100):0;
  return {w1,w2,p1,p2,gain,fill,recall,parts,score};
}

let micStream=null, REC=null, recRunning=false, micDenied=false;
const IS_MOBILE=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
async function ensureMic(){
  if(IS_MOBILE||IN_CLAUDE)return true; // 모바일은 음성인식이 직접 권한을 받음(스트림을 붙잡으면 인식이 막힘)
  if(micStream&&micStream.active)return true;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return false;
  try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});micDenied=false;return true}
  catch(e){micDenied=true;return false}
}
function releaseMic(){try{micStream&&micStream.getTracks().forEach(t=>t.stop())}catch(e){}micStream=null}
function getRecognizer(){
  if(REC||!SR)return REC;
  REC=new SR();REC.lang='en-US';REC.continuous=!IS_MOBILE; // 안드로이드 연속모드 중복 인식 버그 회피: 모바일은 문장 단위로 자동 재시작
  REC.interimResults=true;
  REC.onresult=e=>{if(!active)return;const o=getObj(active.key);let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;
      if(e.results[i].isFinal)active.final+=t.trim()+' ';else interim+=t}
    o.text=(active.final+interim).trim();const ta=document.querySelector(`textarea[data-key="${active.key}"]`);if(ta)ta.value=o.text;refreshMeta(active.key)};
  REC.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){micDenied=true;toast('마이크 권한이 막혀 있습니다. 주소창 왼쪽 아이콘에서 마이크를 허용하거나 키보드 받아쓰기를 쓰세요.')}};
  REC.onstart=()=>{recRunning=true};
  REC.onend=()=>{recRunning=false;if(active&&!micDenied){try{REC.start()}catch(e){}}};
  return REC;
}
function setupDictation(){
  const d=CAP.dictation;if(!d)return;
  const sync=()=>{if(!active)return;const ta=document.querySelector(`textarea[data-key="${active.key}"]`);const o=getObj(active.key);if(ta)ta.value=o.text;refreshMeta(active.key)};
  d.onPartial(({text})=>{if(!active)return;getObj(active.key).text=(active.final+text).trim();sync()});
  d.onFinal(({text})=>{if(!active)return;active.final+=String(text).trim()+' ';getObj(active.key).text=active.final.trim();sync()});
  d.onState(({state,reason})=>{if(state!=='idle'||!active||!reason||reason==='stopped')return;
    if(reason==='not_granted'){dictDenied=true;toast('마이크 사용이 거부됐습니다. 키보드의 받아쓰기 버튼으로 입력하세요.')}
    else if(reason==='time_limit'){try{d.start({language:'en-US'}).catch(()=>{})}catch(e){}}});
}
async function startRec(key){
  if(active)stopRec();
  const o=getObj(key), box=document.querySelector(`[data-box="${key}"]`);
  box.classList.add('recording');
  const btn=box.querySelector('[data-act="rec"]');btn.textContent='정지';btn.className='btn';
  active={key,final:o.text?o.text.trim()+' ':''};

  if(CAP.dictation&&!dictDenied){ // 클릭에서 곧바로 시작해야 권한 요청이 뜸

      if(e.code==='not_granted'){dictDenied=true;toast('마이크 사용이 거부됐습니다. 키보드의 받아쓰기 버튼으로 입력하세요.')}

    return;
  }
  if(!SR){toast('이 브라우저는 음성 인식을 지원하지 않습니다. 타이머는 작동하니 키보드 받아쓰기로 입력하세요.');return}
  await ensureMic();
  const r=getRecognizer();
  if(!recRunning){try{r.start()}catch(e){}}  // 실행 중이면 onend에서 자동 재시작
}
function stopRec(){
  if(!active)return;const a=active;active=null;clearInterval(a.timer);
  if(CAP.dictation){try{CAP.dictation.stop().catch(()=>{})}catch(e){}}

  const box=document.querySelector(`[data-box="${a.key}"]`);

  saveDraft();
}

  let h=`<h2>누적 복습</h2><p class="small mute">새 질문 전에 이전 표현부터. 영어를 떠올린 뒤 정답을 확인하세요.</p>`;
  if(due.length){
    const c=due[0];
    h+=`<div class="flash"><p class="xs mute">남은 카드 ${due.length}장 · ${esc(topicById(c.topic).ko)}</p>
      <div class="ko">${esc(c.ko)}</div>
      ${reveal?`<div class="en">${esc(c.en)}</div>
        <div class="row" style="justify-content:center;margin-top:16px">
          <button class="btn" data-act="grade" data-g="ok" data-id="${c.id}">바로 떠올림</button>
          <button class="btn ghost" data-act="grade" data-g="fuzzy" data-id="${c.id}">애매함</button>
          <button class="btn ghost" data-act="grade" data-g="miss" data-id="${c.id}">못 떠올림</button></div>`
      :`<div style="margin-top:16px"><button class="btn sig" data-act="reveal">영어로 말한 뒤 정답 보기</button></div>`}
    </div>`;
  }else{
    h+=`<p class="small" style="margin:14px 0">${S.cards.length?'오늘 복습할 카드를 모두 끝냈습니다.':'아직 표현 카드가 없습니다. 오늘 막힌 표현이 내일부터 여기에 나옵니다.'}</p>`;
  }
  const rv=D.review;
  if(rv.ok+rv.fuzzy+rv.miss)h+=`<p class="small mute">오늘 복습: 기억 ${rv.ok} · 애매 ${rv.fuzzy} · 모름 ${rv.miss}</p>`;
  if(last){
    h+=`<h3>지난 질문 다시 말하기 (${esc(topicById(last.topicId).ko)})</h3><p class="small mute">답을 보지 않고 소리 내어 30초 이상 답한 질문을 체크하세요.</p><div class="qpick">`;
    last.answers.forEach((a,i)=>{h+=`<label><input type="checkbox" data-act="prevq" data-i="${i}" ${D.prevDone.includes(i)?'checked':''}> ${esc(qText(a.q))}</label>`});
    h+=`</div>`;
  }
  return h+navBtns('주제 선택으로');
}

function phaseTopic(){
  const t=topicById(D.topicId), qs=topicQs(t);
  let h=`<h2>오늘의 주제</h2><p class="small mute">한 번에 다 하지 말고 하루 한 주제만. 아직 안 한 주제가 먼저 추천됩니다.</p><div class="topics" style="margin-top:12px">`;
  const cnt={};S.sessions.forEach(s=>cnt[s.topicId]=(cnt[s.topicId]||0)+1);
  visibleTopics().forEach(x=>{const n=topicQs(x).length;if(!n&&x.id!=='mine')return;
    h+=`<button class="topic ${x.id===D.topicId?'on':''}" data-act="topic" data-id="${x.id}">${esc(x.ko)}<small>${n}문항 · ${cnt[x.id]?cnt[x.id]+'회 학습':'처음'}</small></button>`});
  h+=`</div><h3>질문 고르기 (3~5개 권장, ${D.sel.length}개 선택)</h3>`;
  if(!qs.length)h+=`<p class="small">이 주제에 질문이 없습니다. 노트·설정 탭에서 질문을 붙여넣으세요.</p>`;
  h+=`<div class="row" style="gap:4px;margin-bottom:6px">${['',...Object.keys(QTYPES)].map(k=>`<button class="chip fbtn ${(D.filter||'')===k?'on':''}" data-act="filter" data-k="${k}">${k?QTYPES[k]:'전체'}</button>`).join('')}</div>
    <div class="qpick">${qs.filter(q=>!D.filter||qType(q)===D.filter).map(q=>`<label><input type="checkbox" data-act="sel" data-q="${esc(q)}" ${D.sel.includes(q)?'checked':''}> <span>${qType(q)?`<span class="chip">${QTYPES[qType(q)]}</span> `:''}${esc(qText(q))}</span></label>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" data-act="shuffle">OPIc식 5문항 다시 뽑기</button>
    <button class="btn ghost" data-act="shuffle4">무작위 4개</button>
    <button class="btn ghost" data-act="copyPrompt">AI 음성 대화용 프롬프트 복사</button></div>
    <p class="xs mute">OPIc식 5문항은 기본 → 묘사 → 과거 경험 → 비교·의견 → 롤플레이 순으로 난이도를 올립니다. 비교·의견과 롤플레이가 AL 판정의 핵심입니다.</p>
    <p class="xs mute">프롬프트를 ChatGPT·Claude 음성 모드에 붙여넣으면, 이 질문들을 무작위로 묻고 답마다 원어민식 표현으로 피드백합니다.</p>`;
  return h+navBtns('이 질문으로 1차 답변',D.sel.length>0);
}

    <p class="small mute">번역기·모범답안 금지. 틀려도, 막혀도 끝까지 말하세요. "이걸 영어로 뭐라 하지?" 싶은 순간이 오늘의 수확입니다. 막힌 말은 아래에 한국어로 적어 두세요.</p>`;
  D.answers.forEach((a,i)=>{h+=`<div class="q" data-target="90"><div class="xs mute">Q${i+1}${qType(a.q)?' · '+QTYPES[qType(a.q)]:''}</div><div class="text">${esc(qText(a.q))}</div>${recHTML('a1-'+i,90)}</div>`});
  h+=`<h3>막힌 말 메모 (${D.blocked.length})</h3>
    <div class="row"><input type="text" id="blkIn" placeholder="예: 현장에 나가서 직접 확인했다" style="flex:1"><button class="btn" data-act="addBlk">추가</button></div>

    <p class="small mute">막힌 말의 자연스러운 영어를 AI나 사전으로 찾아 적으세요. 적은 표현은 내일부터 복습 카드로 돌아옵니다.</p>`;
  if(D.blocked.length){
    h+=D.blocked.map((b,i)=>`<div class="blk" style="grid-template-columns:1fr 1.3fr"><span class="small">${esc(b.ko)}</span>
      <input type="text" data-act="blkEn" data-i="${i}" value="${esc(b.en||'')}" placeholder="자연스러운 영어 표현"></div>`).join('');
  }else h+=`<p class="small">메모한 막힌 말이 없습니다. 1차 답변 중 어색했던 문장을 이전 단계에서 추가해도 됩니다.</p>`;
  h+=`<h3>2차 답변: 질문만 보고 다시</h3><p class="small mute">1차 답변을 읽고 외우지 말고, 질문만 보고 다시 말하세요. 첫 번째보다 매끄러우면 성공입니다.</p>`;

function barsHTML(m){return m.parts.map(p=>`<div class="r"><span>${p.k}<br><span class="xs mute">${p.note}</span></span><div class="t"><i style="width:${p.v==null?0:p.v*100}%"></i></div><b style="text-align:right">${p.v==null?'–':Math.round(p.v*p.w)}</b></div>`).join('')}

function viewResult(s,prev,fresh,idx){
  const m=s.metrics;
  const d=(a,b,u='')=>b==null||a==null?'':`<span class="${a-b>=0?'delta-up':'delta-down'}"> ${a-b>=0?'+':''}${Math.round(a-b)}${u}</span>`;
  const avg7=avg(S.sessions.slice(-8,-1).map(x=>x.metrics.score));
  return `<h1>${fresh?'오늘 결과':esc(s.date)+' 결과'}</h1>
    <p class="small mute">${esc(s.date)} · ${esc(topicById(s.topicId).ko)} · ${s.minutes}분 · 질문 ${s.answers.length}개</p>
    <div class="row" style="align-items:flex-end;gap:14px;margin-top:14px">
      <div class="score-big">${m.score}</div>
      <div class="small">직전 대비${d(m.score,prev?.metrics.score)||' –'}<br>최근 7회 평균 ${avg7==null?'–':Math.round(avg7)}</div>
    </div>
    <div class="kpis">
      <div class="kpi"><b>${r1(m.w1)}${d(m.w1,prev?.metrics.w1)}</b><span>1차 평균 단어 수</span></div>
      <div class="kpi"><b>${r1(m.p1)}${d(m.p1,prev?.metrics.p1)}</b><span>1차 WPM</span></div>
      <div class="kpi"><b>${m.gain==null?'–':(m.gain>=0?'+':'')+Math.round(m.gain*100)+'%'}</b><span>1차→2차 개선</span></div>
      <div class="kpi"><b>${m.recall==null?'–':Math.round(m.recall*100)+'%'}</b><span>복습 회상률</span></div>
    </div>

    <h3>원어민 박사 스크립트</h3>
    <p class="small mute">내가 말한 내용과 사실을 그대로 두고, 미국에서 나고 자란 공학 박사가 같은 이야기를 말로 한다면 어떻게 할지 다시 쓴 스크립트입니다. 길이는 원어민 대화 속도(분당 약 150단어)에 맞춥니다.</p>

    </div>`}).join('')}

  const due=dueCards(), all=S.cards;
  const byBox={};all.forEach(c=>{const k=c.interval>=14?'장기':c.interval>=3?'중기':'단기';byBox[k]=(byBox[k]||0)+1});

    <div class="kpis"><div class="kpi"><b>${due.length}</b><span>오늘 복습할 카드</span></div><div class="kpi"><b>${all.length}</b><span>전체 표현</span></div>
    <div class="kpi"><b>${byBox['장기']||0}</b><span>장기 기억 (14일+)</span></div><div class="kpi"><b>${(byBox['단기']||0)+(byBox['중기']||0)}</b><span>익히는 중</span></div></div>`;
  if(due.length&&!D){
    const c=due[reviewIdx%due.length];
    h+=`<div class="flash"><div class="ko">${esc(c.ko)}</div>${reveal?`<div class="en">${esc(c.en)}</div>
      <div class="row" style="justify-content:center;margin-top:16px"><button class="btn" data-act="grade" data-g="ok" data-id="${c.id}">바로 떠올림</button>
      <button class="btn ghost" data-act="grade" data-g="fuzzy" data-id="${c.id}">애매함</button><button class="btn ghost" data-act="grade" data-g="miss" data-id="${c.id}">못 떠올림</button></div>`
      :`<div style="margin-top:16px"><button class="btn sig" data-act="reveal">정답 보기</button></div>`}</div>`;
  }else if(D&&due.length)h+=`<p class="small">진행 중인 60분 세션의 1단계에서 복습하세요. 결과가 오늘 점수에 반영됩니다.</p>`;
  h+=`<h3>지난 세션 질문으로 말하기</h3><p class="small mute">답을 보지 말고 질문만 보고 소리 내어 답하세요.</p>`;
  const recent=S.sessions.slice(-5).reverse();
  if(!recent.length)h+=`<p class="small">아직 기록이 없습니다.</p>`;
  recent.forEach(s=>{h+=`<details class="q"><summary style="cursor:pointer"><b>${esc(s.date)}</b> · ${esc(topicById(s.topicId).ko)}</summary>
    ${s.answers.map(a=>`<p class="small" style="margin-top:8px"><b>${esc(qText(a.q))}</b></p><details><summary class="xs mute" style="cursor:pointer">내 2차 답변 보기</summary><p class="small">${esc(a.a2.text||a.a1.text)}</p></details>`).join('')}</details>`});
  return h;
}

function lineChart(series,labels,max){
  const W=640,H=180,P=28,n=labels.length;if(n<1)return'';
  const x=i=>P+(n===1?(W-2*P)/2:i*(W-2*P)/(n-1)), y=v=>H-P-(v/max)*(H-2*P);
  let g='';[0,.5,1].forEach(f=>{const yy=y(max*f);g+=`<line x1="${P}" x2="${W-P/2}" y1="${yy}" y2="${yy}" stroke="var(--concrete)"/><text x="2" y="${yy+3}">${Math.round(max*f)}</text>`});
  series.forEach(s=>{const pts=s.v.map((v,i)=>v==null?null:[x(i),y(Math.min(v,max))]).filter(Boolean);
    if(pts.length>1)g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2.5" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
    pts.forEach(p=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${s.c}"/>`)});
  const step=Math.ceil(n/8);labels.forEach((l,i)=>{if(i%step===0||i===n-1)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${l}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>
    <div class="row xs mute">${series.map(s=>`<span><span style="display:inline-block;width:10px;height:10px;background:${s.c};border-radius:2px"></span> ${s.n}</span>`).join('')}</div>`;
}
function streak(){
  const days=new Set(S.sessions.map(s=>s.date));let n=0,off=days.has(todayStr())?0:-1;
  while(days.has(todayStr(off))){n++;off--}return n;
}
function viewGrowth(){

/* ================= native script ================= */
function targetFor(a){
  const L=S.settings.len;
  const secs=L==='mine'?Math.max(30,Math.min(180,Math.max(a.a1.secs||0,a.a2.secs||0)||60)):+L;
  return {secs,words:Math.round(secs*2.5)};
}
function persona(){
  const bg=(S.settings.bg||'').trim()||'a Korean adult learner of English preparing for the OPIc AL speaking test';
  return `You are rewriting a spoken answer by ${bg}.
Rewrite it the way the SAME person would say it if they had been born and raised in the US: a native speaker of General American English with the same education level and profession. Educated and articulate, but natural spoken English (contractions, natural discourse markers like "honestly", "the thing is", "so", varied sentence length), never written-essay style.
Rules: keep the speaker's own facts, opinions, and story; do not invent new personal facts (you may add brief generic elaboration that clearly fits what they said); answer every part of the question; make it flow as one natural spoken turn.`;
}
function answerText(a){return (a.a2.text||a.a1.text||'').trim()}
function onePrompt(a){
  const tg=targetFor(a), t=answerText(a);
  return `${persona()}
Target length: about ${tg.words} words (about ${tg.secs} seconds at 150 words per minute), within ±10%.
Question: ${qText(a.q)}
Speaker's answer (speech-recognition transcript, may contain recognition errors): ${t||'(no answer given — write a natural model answer using only generic, plausible details)'}
Return ONLY JSON, no markdown: {"script":"...","phrases":[{"en":"a natural expression used in the script","ko":"짧은 한국어 뜻"}]} with exactly 3 phrases.`;
}
function batchPrompt(s){
  return `${persona()}
Do this for each question below. Match each target length (150 words per minute, within ±10%).
Return ONLY the scripts in exactly this format, nothing else:
### Q1
(script)
### Q2
(script)

${s.answers.map((a,j)=>{const tg=targetFor(a);return `Q${j+1} (target ≈ ${tg.words} words / ${tg.secs} s)
Question: ${qText(a.q)}
Speaker's answer: ${answerText(a)||'(no answer given)'}`}).join('\n\n')}`;
}
let genTried={}, genErr={}, genProg={}, autoGen=null;
function parseScript(raw){
  const txt=String(raw||'').replace(/```json|```/g,'');
  const j=JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1));
  if(!j.script)throw new Error('스크립트가 비어 있습니다');
  return {text:String(j.script).trim(),phrases:(j.phrases||[]).slice(0,3),at:new Date().toISOString(),target:null};
}
async function callClaude(prompt){
  if(CAP.sample){
    let r;try{r=await CAP.sample(prompt,{modelTier:'default'})}catch(e){const err=new Error((e&&e.message)||'AI 호출 실패');err.sampleCode=e&&e.code;throw err}
    return parseScript(r.text);
  }
  const key=getKey();
  const headers={'content-type':'application/json'};
  if(key)Object.assign(headers,{'x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'});
  let res;
  try{
    res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,
      body:JSON.stringify({model:key?(S.settings.model||'claude-sonnet-5'):'claude-sonnet-4-6',max_tokens:key?1500:1000,messages:[{role:'user',content:prompt}]})});
  }catch(e){const err=new Error('NETWORK');err.net=true;throw err}
  let data={};try{data=await res.json()}catch(e){}
  if(!res.ok){const err=new Error(data?.error?.message||('HTTP '+res.status));err.auth=(res.status===401||res.status===403);throw err}
  const txt=(data.content||[]).map(b=>b.type==='text'?b.text:'').join('').replace(/```json|```/g,'');
  const j=JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1));
  if(!j.script)throw new Error('스크립트가 비어 있습니다');
  return {text:j.script.trim(),phrases:(j.phrases||[]).slice(0,3),at:new Date().toISOString(),target:null};
}
const hasAnswer=a=>!!answerText(a);
async function genScripts(i,only){
  const s=S.sessions[i];if(!s||genBusy[i])return;
  const list=s.answers.map((a,j)=>j).filter(j=>(only==null||j===only)&&hasAnswer(s.answers[j]));
  genTried[i]=true;genErr[i]='';
  if(!list.length){genErr[i]='1차·2차 답변이 모두 비어 있어 스크립트를 쓸 내용이 없습니다.';render(true);return}
  genBusy[i]=true;genProg[i]={done:0,total:list.length};render(true);
  let fail=0,last=null;
  for(const j of list){
    try{const m=await callClaude(onePrompt(s.answers[j]));m.target=targetFor(s.answers[j]).secs;s.answers[j].model=m;save()}
    catch(e){fail++;last=e}
    genProg[i].done++;render(true);
  }
  genBusy[i]=false;
  if(fail){
    if(last&&last.sampleCode==='not_granted')genErr[i]='Claude 사용 요청을 거절해서 자동 작성을 못 했습니다. 페이지를 새로 열고 다시 작성을 누르면 다시 묻습니다. 아래 수동 작성도 쓸 수 있습니다.';
    else if(last&&last.sampleCode==='rate_limited')genErr[i]='요청이 많아 잠시 막혔습니다. 1~2분 뒤 다시 작성을 눌러 주세요.';
    else if(last&&last.sampleCode)genErr[i]=`자동 작성에 실패했습니다 (${last.message}). 다시 작성을 눌러 주세요.`;
    else if(last&&(last.net||last.auth)&&!getKey())genErr[i]='자동 작성에는 노트·설정 탭의 Anthropic API 키가 필요합니다. 키 없이 쓰려면 아래 수동 작성을 이용하세요.';
    else if(last&&last.auth)genErr[i]='API 키가 거부됐습니다. 노트·설정 탭에서 키를 확인하세요.';
    else genErr[i]=`${fail}개 문항 작성에 실패했습니다 (${last?last.message:''}). 다시 작성을 누르세요.`;
  }
  render(true);
  toast(fail?`${list.length-fail}/${list.length}개 문항 작성`:'스크립트를 모두 작성했습니다.');
}
function parsePasted(i,txt){
  const s=S.sessions[i];const parts=txt.split(/^\s*#{2,3}\s*Q\s*(\d+)\s*$/m);let n=0;
  for(let k=1;k<parts.length;k+=2){const j=+parts[k]-1,body=(parts[k+1]||'').trim();
    if(s.answers[j]&&body){s.answers[j].model={text:body,phrases:[],at:new Date().toISOString(),target:targetFor(s.answers[j]).secs};n++}}
  if(!n&&s.answers.length===1&&txt.trim()){s.answers[0].model={text:txt.trim(),phrases:[],at:new Date().toISOString()};n=1}
  save();return n;
}
/* ---- text to speech ---- */
let speakBtn=null, speakTok=0, ttsOff=false;
const CLAUDE_VOICES=[['buttery','Claude 음성 A (기본)'],['airy','Claude 음성 B'],['glassy','Claude 음성 C'],['rounded','Claude 음성 D']];
function voices(){return (window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>/^en[-_]US/i.test(v.lang))}
const browserVoiceName=()=>{const v=S.settings.voice||'';return v.startsWith('browser:')?v.slice(8):(v&&!v.startsWith('claude:')?v:'')};
function useClaudeTTS(){const v=S.settings.voice||'';return !!CAP.tts&&!ttsOff&&(v===''||v.startsWith('claude:'))}
function pickVoice(){
  const vs=voices(),want=browserVoiceName();if(want){const v=vs.find(x=>x.name===want);if(v)return v}
  const pref=['Google US English','Microsoft Aria','Microsoft Jenny','Microsoft Guy','Samantha','Alex','Microsoft Zira','Microsoft David'];
  for(const p of pref){const v=vs.find(x=>x.name.includes(p));if(v)return v}
  return vs[0]||null;
}
function fillVoices(){const sel=$('#voiceSel');if(!sel)return;
  const cur=S.settings.voice||'';const vs=voices();let h='';
  if(CAP.tts)h+=CLAUDE_VOICES.map(([k,l])=>`<option value="claude:${k}" ${(cur===''&&k==='buttery')||cur==='claude:'+k?'selected':''}>${l}</option>`).join('');
  else h+=`<option value="">자동 선택 (미국 영어)</option>`;
  h+=vs.map(v=>`<option value="browser:${esc(v.name)}" ${browserVoiceName()===v.name?'selected':''}>기기 음성 · ${esc(v.name)}</option>`).join('');
  if(!CAP.tts&&!vs.length)h+='<option disabled>이 브라우저에 미국 영어 음성이 없습니다</option>';
  sel.innerHTML=h}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{if(PID&&tab==='notes')fillVoices()};
function resetSpeakBtn(){if(speakBtn){speakBtn.textContent='🔊 듣기';speakBtn.classList.remove('playing')}speakBtn=null}
function stopSpeak(){speakTok++;if(CAP.tts){try{CAP.tts.stop().catch(()=>{})}catch(e){}}if(window.speechSynthesis)speechSynthesis.cancel();resetSpeakBtn()}
const sentences=t=>(t.match(/[^.!?]+[.!?]+["'’”)\]]*|[^.!?]+$/g)||[t]).map(x=>x.trim()).filter(Boolean);
function speak(text,btn){
  const same=!!btn&&speakBtn===btn;stopSpeak();if(same)return;
  const tok=++speakTok;speakBtn=btn;if(btn){btn.textContent='■ 정지';btn.classList.add('playing')}
  const done=()=>{if(tok===speakTok)resetSpeakBtn()};
  const chunks=sentences(text);
  if(useClaudeTTS()){
    const v=(S.settings.voice||'claude:buttery').replace('claude:','')||'buttery';
    CAP.tts.speak(chunks.map(c=>({text:c})),{voice:v,rate:Math.max(0.7,Math.min(1.5,S.settings.rate)),language:'en'})
      .then(done).catch(e=>{if(tok!==speakTok)return;
        if(e&&['not_granted','unavailable','upstream_error','no_gesture'].includes(e.code)){if(e.code==='not_granted')ttsOff=true;browserSpeak(chunks,done)}
        else{if(e&&e.code==='rate_limited')toast('읽기 요청이 많습니다. 잠시 후 다시 눌러 주세요.');done()}});
    return;
  }
  browserSpeak(chunks,done);
}
function browserSpeak(chunks,done){
  if(!window.speechSynthesis){toast('이 화면에서는 읽어주기를 쓸 수 없습니다.');done();return}
  const v=pickVoice();
  chunks.forEach((c,k)=>{const u=new SpeechSynthesisUtterance(c);u.lang='en-US';if(v)u.voice=v;u.rate=S.settings.rate;if(k===chunks.length-1){u.onend=done;u.onerror=done}speechSynthesis.speak(u)});
}

function gradeCard(id,g){
  const c=S.cards.find(x=>x.id===id);if(!c)return;
  const idx=INTERVALS.indexOf(c.interval);
  if(g==='ok')c.interval=INTERVALS[Math.min(idx+1,INTERVALS.length-1)];
  else if(g==='miss')c.interval=1;
  c.due=addDays(todayStr(),c.interval);c.reps=(c.reps||0)+1;
  if(D&&tab==='today'){D.review[g]++;D.review.ids.push(id);saveDraft()}

function buildAnswers(){
  if(!D.sel.length){D.sel=ladder(topicQs(topicById(D.topicId)));if(!D.sel.length)D.sel=ladder(topicQs(visibleTopics()[0]))}
  const prev={};D.answers.forEach(x=>prev[x.q]=x);
  D.answers=D.sel.map(q=>prev[q]||{q,a1:{text:'',secs:0},a2:{text:'',secs:0}});

function goPhase(n){

function copyText(txt,msg){

}
function finish(){
  stopRec();if(D.pausedAt){D.pausedMs=(D.pausedMs||0)+Date.now()-D.pausedAt;D.pausedAt=null}
  D.answers.forEach(a=>{a.a1.text=a.a1.text.trim();a.a2.text=a.a2.text.trim()});
  const metrics=computeMetrics(D);
  let added=0;
  D.blocked.forEach(b=>{if((b.en||'').trim()){S.cards.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),ko:b.ko,en:b.en.trim(),topic:D.topicId,created:D.date,interval:1,due:addDays(D.date,1),reps:0});added++}});
  S.sessions.push({_id:newId(),createdAt:new Date().toISOString(),date:D.date,topicId:D.topicId,minutes:Math.max(1,Math.round(elapsedSec()/60)),
    answers:D.answers,blocked:D.blocked,review:{ok:D.review.ok,fuzzy:D.review.fuzzy,miss:D.review.miss},self:D.self,metrics,cardsAdded:added});
  save();D=null;saveDraft();releaseMic();justSaved=S.sessions.length-1;render();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-tab]');if(!t)return;if(!PID&&!['pickProfile','authTab','doAuth','reload'].includes(t.dataset.act))return;
  if(t.dataset.tab){tab=t.dataset.tab;justSaved=null;openIdx=null;reveal=false;stopSpeak();render();return}
  const a=t.dataset.act;
  if(a==='pickProfile'){$('#app').innerHTML='<div style="padding-top:20vh;text-align:center" class="mute">불러오는 중…</div>';loadProfile(t.dataset.id).then(()=>render());return}
  if(a==='authTab'){authTab=t.dataset.t;render();return}
  if(a==='doAuth'){doAuth();return}
  if(a==='reload'){location.reload();return}
  if(a==='switchProfile'){(D?ask(FB?'진행 중인 세션은 저장돼 있어 다시 로그인하면 이어집니다. 로그아웃할까요?':'진행 중인 세션은 저장된 상태 그대로 남고, 다음에 이 사용자로 들어오면 이어집니다. 사용자를 바꿀까요?'):Promise.resolve(true)).then(ok=>{if(ok)(FB?doLogout():switchProfile())});return}
  if(a==='saveName'){S.settings.name=$('#nameText').value.trim();save();render(true);toast('이름을 저장했습니다.');return}
  if(a==='saveBg'){S.settings.bg=$('#bgText').value.trim();save();toast('배경을 저장했습니다.');return}
  if(a==='start'){D=newDraft();saveDraft();render();if(SR)ensureMic().then(ok=>{if(!ok)toast('마이크 권한을 받지 못했습니다. 녹음할 때 다시 요청하거나 키보드 받아쓰기를 쓰세요.')})}
  else if(a==='next')goPhase(D.phase+1);
  else if(a==='goPhase')goPhase(+t.dataset.i);
  else if(a==='prev'){D.phase--;saveDraft();render()}
  else if(a==='finish')finish();
  else if(a==='closeResult'){justSaved=null;render()}
  else if(a==='reveal'){reveal=true;render(true)}
  else if(a==='grade')gradeCard(t.dataset.id,t.dataset.g);
  else if(a==='topic'){D.topicId=t.dataset.id;D.sel=ladder(topicQs(topicById(D.topicId)));saveDraft();render(true)}
  else if(a==='filter'){D.filter=t.dataset.k;saveDraft();render(true)}
  else if(a==='shuffle4'){D.sel=topicQs(topicById(D.topicId)).slice().sort(()=>Math.random()-.5).slice(0,4);saveDraft();render(true)}
  else if(a==='shuffle'){D.sel=ladder(topicQs(topicById(D.topicId)));saveDraft();render(true)}
  else if(a==='shuffleOld'){const qs=topicQs(topicById(D.topicId)).slice().sort(()=>Math.random()-.5);D.sel=qs.slice(0,4);saveDraft();render()}
  else if(a==='copyPrompt'){
    const txt=`지금부터 영어 회화 연습을 하자. 아래 질문 목록에서 하나씩 무작위로 영어로 물어봐 줘. 내 대답이 끝나면 (1) 원어민이 실제로 쓰는 자연스러운 표현으로 고친 문장, (2) 내가 막히거나 어색했던 부분을 대신할 표현 2~3개를 알려주고, 다음 질문으로 넘어가 줘. 내 목표는 OPIc AL 수준의 자연스러운 스피킹이야.\n\n질문:\n${D.sel.map(q=>'- '+qText(q)).join('\n')}`;
    copyText(txt,'프롬프트를 복사했습니다.')}
  else if(a==='pause'){if(D.pausedAt){D.pausedMs=(D.pausedMs||0)+Date.now()-D.pausedAt;D.pausedAt=null;toast('다시 시작합니다.')}else{stopRec();D.pausedAt=Date.now();toast('일시정지했습니다.')}saveDraft();render(true)}
  else if(a==='resetTime'){ask('학습 시간을 0:00으로 되돌립니다. 답변과 메모는 그대로 남습니다.').then(ok=>{if(!ok||!D)return;
    stopRec();D.startedAt=Date.now();D.pausedMs=0;D.pausedAt=Date.now();saveDraft();render(true);toast('시간을 초기화했습니다. 계속하기를 누르면 0:00부터 시작합니다.')})}
  else if(a==='restart'){ask('현재 세션의 답변·막힌 말 메모·선택한 질문이 모두 지워지고 1단계부터 새로 시작합니다. 이미 넘긴 복습 카드 결과는 유지됩니다.').then(ok=>{if(!ok||!D)return;
    stopRec();const rv=D.review,pd=D.prevDone;D=newDraft();D.review=rv;D.prevDone=pd;saveDraft();render();toast('새 세션을 0:00부터 시작합니다.')})}
  else if(a==='rec'&&D&&D.pausedAt){toast('일시정지 중입니다. 계속하기를 누르세요.')}
  else if(a==='rec'){active&&active.key===t.dataset.key?stopRec():startRec(t.dataset.key)}
  else if(a==='clear'){if(active&&active.key===t.dataset.key)stopRec();const o=getObj(t.dataset.key);o.text='';o.secs=0;saveDraft();render(true)}
  else if(a==='addBlk'){const v=$('#blkIn').value.trim();if(!v)return;D.blocked.push({ko:v,en:''});saveDraft();render(true);setTimeout(()=>$('#blkIn')&&$('#blkIn').focus(),0)}
  else if(a==='delBlk'){D.blocked.splice(+t.dataset.i,1);saveDraft();render(true)}
  else if(a==='speak'){const m=S.sessions[+t.dataset.i].answers[+t.dataset.j].model;if(m)speak(m.text,t)}
  else if(a==='genAll'){genScripts(+t.dataset.i,null)}
  else if(a==='genOne'){genScripts(+t.dataset.i,+t.dataset.j)}
  else if(a==='copyModel'){copyText(batchPrompt(S.sessions[+t.dataset.i]),'스크립트 요청 프롬프트를 복사했습니다. Claude나 ChatGPT에 붙여넣으세요.')}
  else if(a==='pasteModel'){const n=parsePasted(+t.dataset.i,$('#pasteModel').value);toast(n?`스크립트 ${n}개를 저장했습니다.`:'형식을 찾지 못했습니다. "### Q1" 형식인지 확인하세요.');if(n)render(true)}
  else if(a==='phrasesToCards'){const s0=S.sessions[+t.dataset.i],an=s0.answers[+t.dataset.j];if(an.model.carded)return;
    an.model.phrases.forEach(ph=>S.cards.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),ko:ph.ko||qText(an.q),en:ph.en,topic:s0.topicId,created:todayStr(),interval:1,due:addDays(todayStr(),1),reps:0}));
    an.model.carded=true;save();render(true);toast('핵심 표현 3개를 내일 복습에 추가했습니다.')}
  else if(a==='saveKey'){setKey($('#apiKey').value.trim());S.settings.model=$('#modelName').value.trim()||'claude-sonnet-5';save();toast('저장했습니다.')}
  else if(a==='delKey'){setKey('');$('#apiKey').value='';toast('API 키를 삭제했습니다.')}
  else if(a==='testVoice'){speak('Hi, I\'m a geotechnical engineer, and my research focuses on monitoring retaining walls.',t)}
  else if(a==='openSession'){openIdx=+t.dataset.i;render()}
  else if(a==='saveCustom'){const id=$('#cTopic').value;S.custom[id]=$('#cText').value.split('\n').map(s=>s.replace(/^[-•\d.\s]+/,'').trim()).filter(Boolean);save();loadCustom();toast('질문을 저장했습니다.')}
  else if(a==='delCard'){S.cards=S.cards.filter(c=>c.id!==t.dataset.id);save();$('#cardList').innerHTML=cardList($('#cardSearch')?.value||'')}
  else if(a==='export'){const fname=`speaking-${PID}-${todayStr()}.json`,data=JSON.stringify(Object.assign({},S,{apiKey:undefined}),null,1);
    if(CAP.downloads){CAP.downloads.save({filename:fname,data}).then(()=>toast('백업 파일을 저장했습니다.')).catch(e=>{if(e&&e.code!=='declined')toast('내려받기에 실패했습니다.')});return}
    const b=new Blob([data],{type:'application/json'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download=`speaking-${PID}-${todayStr()}.json`;l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
  else if(a==='import')$('#importFile').click();
  else if(a==='reset'){ask(`${profileName()}의 모든 세션, 표현 카드, 내 질문이 삭제됩니다. 계속할까요?`).then(ok=>{if(!ok)return;S={sessions:[],cards:[],custom:{},settings:S.settings};D=null;save();saveDraft();render()})}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='sel'){const q=t.dataset.q;D.sel=t.checked?[...D.sel,q]:D.sel.filter(x=>x!==q);saveDraft();render(true)}
  else if(t.dataset.act==='prevq'){const i=+t.dataset.i;D.prevDone=t.checked?[...D.prevDone,i]:D.prevDone.filter(x=>x!==i);saveDraft()}
  else if(t.dataset.act==='setLen'){S.settings.len=t.value;save();render(true)}
  else if(t.dataset.act==='faculty'){S.settings.faculty=t.checked;save()}
  else if(t.id==='voiceSel'){S.settings.voice=t.value;ttsOff=false;save()}
  else if(t.id==='cTopic')loadCustom();
  else if(t.id==='importFile'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.sessions))throw 0;S={sessions:d.sessions,cards:d.cards||[],custom:d.custom||{},settings:Object.assign({},S.settings,d.settings||{})};S.sessions.forEach(x=>{if(!x._id)x._id=newId()});save();toast(`세션 ${S.sessions.length}개를 불러왔습니다.`);render()}catch(_){toast('백업 파일 형식이 아닙니다.')}};r.readAsText(t.files[0]);t.value=''}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.tagName==='TEXTAREA'&&t.dataset.key){getObj(t.dataset.key).text=t.value;refreshMeta(t.dataset.key);saveDraft()}
  else if(t.dataset.act==='blkEn'){D.blocked[+t.dataset.i].en=t.value;saveDraft()}
  else if(t.dataset.act==='self'){D.self[t.dataset.k]=+t.value;$(t.dataset.k==='natural'?'#vn':'#vc').textContent=t.value;
    const m=computeMetrics(D);$('#preScore').textContent=m.score;$('#preBars').innerHTML=barsHTML(m);saveDraft()}
  else if(t.dataset.act==='setRate'){S.settings.rate=+t.value;$('#rateV').textContent=t.value+'x';save()}
  else if(t.id==='cardSearch')$('#cardList').innerHTML=cardList(t.value);
});
document.addEventListener('keydown',e=>{if(!PID&&e.key==='Enter'&&e.target.closest&&e.target.closest('.fl')){e.preventDefault();doAuth();return}if(e.target.id==='blkIn'&&e.key==='Enter'){e.preventDefault();document.querySelector('[data-act="addBlk"]').click()}});
setInterval(()=>{const c=$('#clock');if(c&&D&&PID){const s=elapsedSec();c.textContent=`${fmt(s)} / 60:00`;c.style.color=s>3600?'var(--alert)':''}},1000);

migrateLegacy();
let autoPaused=false;
window.addEventListener('pagehide',()=>{if(PID)flush()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&PID)flush();if(!PID||!D)return;
  if(document.hidden&&!D.pausedAt){stopRec();D.pausedAt=Date.now();autoPaused=true;saveDraft()}
  else if(!document.hidden&&autoPaused){autoPaused=false;if(tab==='today'){render(true);toast('다른 창으로 이동해 자동 일시정지됐습니다. 계속하기를 누르세요.')}}});
render();
initCaps().then(loadStats).catch(()=>{}).then(()=>{BOOTED=true;render()});
</script>
</body>
